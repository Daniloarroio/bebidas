<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#70472f">
  <title>Entrar | Casa de Madeira</title>
  <link rel="stylesheet" href="css/login.css">
  <script src="js/api.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="signup-card" aria-labelledby="page-title">
      <p class="brand">Casa de Madeira</p>

      <div class="intro">
        <p class="eyebrow">BEM-VINDO DE VOLTA</p>
        <h1 id="page-title">Entrar na conta</h1>
        <p class="subtitle">Informe seu e-mail e sua senha.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required maxlength="150" aria-describedby="email-error">
          <small class="field-error" id="email-error"></small>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required aria-describedby="password-error">
            <button class="show-password" type="button" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <small class="field-error" id="password-error"></small>
        </div>

        <button class="submit-button" type="submit">Confirmar</button>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>

      <p class="signup-link">Não tem uma conta? <a href="cadastro.html">Crie seu cadastro</a></p>
    </section>
  </main>
</body>
</html>
